<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blomstra — Portal</title>
<link rel="stylesheet" href="fonts/fonts.css">
<!-- Misma hoja que usa el tema hijo: prototipo y WordPress no pueden divergir. -->
<link rel="stylesheet" href="../wordpress/themes/blomstra-child/assets/css/blomstra.css">
</head>
<body>

<div class="bl-portal">

  <header class="bl-header">
    <button class="bl-burger" type="button" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <a class="bl-brand" href="/">
      <span class="bl-brand__kicker">This is</span>
      <span class="bl-brand__name">BLOMSTRA</span>
    </a>

    <div class="bl-tools">
      <a class="bl-lang" href="#">EN
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
      <a class="bl-btn-ghost" href="#">WHATS</a>
    </div>
  </header>

  <main class="bl-portal__body">

    <section class="bl-panel">
      <span class="bl-badge">01</span>
      <p class="bl-lockup">
        <span class="bl-lockup__name">BLOMSTRA</span>
        <span class="bl-lockup__sub">Visual</span>
      </p>
      <nav class="bl-panel__nav" aria-label="Blomstra Visual">
        <a href="#" aria-current="page">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">LOOKBOOK</a>
        <a href="#">CONTACT US</a>
      </nav>
    </section>

    <section class="bl-panel">
      <span class="bl-badge">03</span>
      <p class="bl-lockup">
        <span class="bl-lockup__name">BLOMSTRA</span>
        <span class="bl-lockup__sub">Experiences</span>
      </p>
      <nav class="bl-panel__nav" aria-label="Blomstra Experiences">
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">LOOKBOOK</a>
      </nav>
    </section>

  </main>

  <footer class="bl-portal__footer">
    <a href="#">CONTACT US</a>
    <a href="#">BEHIND BLOMSTRA</a>
    <a href="#">NEWSLETTER</a>
  </footer>

</div>

</body>
</html>
