<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blomstra Visual — Servicios</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="../wordpress/themes/blomstra-child/assets/css/blomstra.css">
</head>
<body>

<div class="bl-split">

  <header class="bl-header">
    <button class="bl-burger" type="button" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="bl-brand" href="/">
      <span class="bl-brand__kicker">This is</span>
      <span class="bl-brand__name">BLOMSTRA</span>
    </a>
    <div class="bl-tools">
      <a class="bl-lang" href="#">EN
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
      <a class="bl-btn-ghost" href="#">WHATS</a>
    </div>
  </header>

  <main class="bl-split__body">

    <!-- Panel izquierdo. El fondo cambia por submarca/servicio: en el diseño
         aparece tanto en crema (bone) como en BLEU HORIZON. Se cambia la clase
         de fondo y nada más. -->
    <aside class="bl-split__aside bl-split__aside--dashed bl-bg--bone">
      <p class="bl-lockup">
        <span class="bl-lockup__name">BLOMSTRA</span>
        <span class="bl-lockup__sub">Visual</span>
      </p>

      <p class="bl-eyebrow">
        <span class="bl-eyebrow__num">02</span>
        <span class="bl-eyebrow__label">Identidad visual</span>
      </p>

      <div class="bl-media" role="img" aria-label="Imagen del servicio (pendiente)"></div>

      <p class="bl-copy">Para emprendedoras y proyectos que quieren transformar una idea en una marca clara, coherente y magnética.</p>
    </aside>

    <section class="bl-split__main bl-bg--cotton">
      <h1 class="bl-split__title">Nuestros servicios:</h1>

      <nav class="bl-services" aria-label="Servicios de Blomstra Visual">
        <a class="bl-services__item" href="#" aria-current="true">
          <span class="bl-services__num">01</span>
          <span class="bl-services__label">Identidad visual</span>
          <svg class="bl-services__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="bl-services__item" href="#">
          <span class="bl-services__num">03</span>
          <span class="bl-services__label">Diseño web</span>
          <svg class="bl-services__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="bl-services__item" href="#">
          <span class="bl-services__num">02</span>
          <span class="bl-services__label">Experiencia de marca</span>
          <svg class="bl-services__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
        <a class="bl-services__item" href="#">
          <span class="bl-services__num">02</span>
          <span class="bl-services__label">Direcció d’art</span>
          <svg class="bl-services__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </nav>
    </section>

  </main>
</div>

</body>
</html>
