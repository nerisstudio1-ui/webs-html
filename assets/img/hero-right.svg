  <g><path d="M81,490 Q552,315 1023,500" fill="none" stroke="#57504B" stroke-width="1.3" opacity="0.22"/><path d="M93,686 Q586,530 1079,700" fill="none" stroke="#57504B" stroke-width="1.3" opacity="0.22"/><path d="M127,882 Q599,791 1072,900" fill="none" stroke="#57504B" stroke-width="1.3" opacity="0.22"/></g>
