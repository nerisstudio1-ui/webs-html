<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-label="Detalle de pigmentos y herramientas">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DAD3CD"/><stop offset="1" stop-color="#A79C94"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="100"/></filter>
