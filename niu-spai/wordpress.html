  <style>
    /* Pantalla única: blau Niu amb llum suau, marca al centre, serveis pujant pels laterals */
    :root {
      --blue: #3868B0;
      --blue-deep: #1f3f73;
      --cream: #FAF5F0;
      --cream-soft: rgba(250, 245, 240, 0.78);
      --serif: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
      --sans: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      --hand: 'Nothing You Could Do', 'Segoe Print', 'Bradley Hand', cursive;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--blue);
      color: var(--cream);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Fons: blau Niu amb llum suau que es mou ---------- */
    .light, .grain, #float {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .light { z-index: 0; overflow: hidden; }
    .light span {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      will-change: transform;
    }
    .light .l1 {
      width: 80vmax; height: 80vmax;
      top: -35vmax; left: -20vmax;
      background: radial-gradient(circle, rgba(250, 245, 240, .22), transparent 60%);
      animation: glow1 28s ease-in-out infinite alternate;
    }
    .light .l2 {
      width: 70vmax; height: 70vmax;
      bottom: -35vmax; right: -25vmax;
      background: radial-gradient(circle, rgba(250, 245, 240, .14), transparent 60%);
      animation: glow2 34s ease-in-out infinite alternate;
    }
    .light .l3 {
      width: 60vmax; height: 60vmax;
      top: 30%; left: 40%;
      background: radial-gradient(circle, rgba(31, 63, 115, .45), transparent 60%);
      animation: glow1 40s ease-in-out infinite alternate-reverse;
    }
    @keyframes glow1 { to { transform: translate(14vmax, 10vmax) scale(1.1); } }
    @keyframes glow2 { to { transform: translate(-12vmax, -8vmax) scale(1.12); } }
    .grain { z-index: 1; opacity: .04; background-size: 180px 180px; }

    /* ---------- Serveis que pugen ---------- */
    #float { z-index: 4; overflow: hidden; }
    .word {
      position: absolute;
      bottom: -10vh;
      white-space: nowrap;
      font-family: var(--hand);
      font-weight: 400;
      color: var(--cream);
      opacity: 0;
      will-change: transform, opacity;
      animation: rise linear forwards;
    }
    .word i {
      display: inline-block;
      font-style: inherit;
      animation: sway 7s ease-in-out infinite alternate;
    }
    @keyframes rise {
      0%   { transform: translateY(0);      opacity: 0; }
      14%  { opacity: var(--o); }
      78%  { opacity: var(--o); }
      100% { transform: translateY(-125vh); opacity: 0; }
    }
    @keyframes sway {
      from { transform: translateX(-12px); }
      to   { transform: translateX(12px); }
    }

    /* ---------- Contingut ---------- */
    main {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 16px 88px;
    }
    main::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: min(820px, 100%);
      height: 88%;
      transform: translate(-50%, -50%);
      background: radial-gradient(closest-side, var(--blue) 55%, rgba(56, 104, 176, 0) 100%);
      opacity: .92;
      z-index: -1;
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(220px, 56vw, 320px);
      max-width: 100%;
      aspect-ratio: 1;
    }
    .breath {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(250, 245, 240, .38);
      animation: breathe 8s ease-in-out infinite;
    }
    .breath.two { inset: 13%; border-color: rgba(250, 245, 240, .22); animation-delay: -.7s; }
    @keyframes breathe {
      0%, 100% { transform: scale(.86); opacity: .5; }
      50%      { transform: scale(1);   opacity: 1; }
    }

    .logo {
      position: relative;
      display: block;
      width: clamp(150px, 44vw, 230px);
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 2px 24px rgba(20, 40, 80, .35));
      animation: appear 2.4s ease both;
    }

    .tag {
      font-size: 11px;
      letter-spacing: .42em;
      margin-right: -.42em;
      text-transform: uppercase;
      color: var(--cream-soft);
      animation: appear 2.4s .5s ease both;
    }

    .line {
      width: 1px;
      height: 44px;
      margin: 26px auto;
      background: linear-gradient(var(--cream), transparent);
      opacity: .6;
      animation: appear 2.4s .8s ease both;
    }

    h1 {
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(1.55rem, 5vw, 2.3rem);
      line-height: 1.3;
      letter-spacing: .01em;
      max-width: 560px;
      text-wrap: balance;
      animation: appear 2.4s 1s ease both;
    }
    h1 strong { font-weight: 500; }

    .soon {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: .38em;
      margin-right: -.38em;
      text-transform: uppercase;
      animation: appear 2.4s 1.3s ease both;
    }
    .soon::before, .soon::after {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
      opacity: .5;
    }

    .lead {
      max-width: 410px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--cream);
      animation: appear 2.4s 1.6s ease both;
    }

    .lead strong { font-weight: 500; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    .lang {
      position: fixed;
      top: 0; right: 0;
      z-index: 6;
      display: flex;
      gap: 4px;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 0;
    }
    .lang button {
      font: inherit;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .18em;
      color: var(--cream-soft);
      background: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 6px 10px 6px 12px;
      cursor: pointer;
      transition: color .3s, border-color .3s;
    }
    .lang button:hover { color: var(--cream); }
    .lang button[aria-pressed="true"] {
      color: var(--cream);
      border-color: rgba(250, 245, 240, .45);
    }
    .lang button:focus-visible { outline: 1px solid var(--cream); outline-offset: 2px; }

    footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 5;
      padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--cream-soft);
    }

    @media (max-height: 640px) {
      .logo-wrap { width: 190px; }
      .line { height: 24px; margin: 14px auto; }
      footer { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .breath, .word i, .logo, .tag, .line, h1, .soon, .lead { animation: none; }
      .light span { animation: none; }
    }
  </style>

    <p class="tag" data-i18n="tag">Benestar conscient</p>

    <div class="line" aria-hidden="true"></div>

    <h1 data-i18n="title">Cuidem de tu en <strong>cada etapa</strong> de la vida</h1>

    <p class="soon" data-i18n="soon">Pròximament</p>

    <p class="lead" data-i18n="lead">Un espai de <strong>benestar conscient</strong> on diferents professionals <strong>t’acompanyem</strong> amb una mirada <strong>integral, propera i personalitzada</strong>.</p>
  </main>

  <footer>&copy; <span id="year">2026</span> <span data-i18n="footer">NIU · BENESTAR CONSCIENT</span></footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Gra de pel·lícula ---------- */
    (function () {
      const c = document.createElement('canvas');
      c.width = c.height = 180;
      const g = c.getContext('2d');
      const d = g.createImageData(180, 180);
      for (let i = 0; i < d.data.length; i += 4) {
        const v = Math.random() * 255;
        d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
        d.data[i + 3] = 255;
      }
      g.putImageData(d, 0, 0);
      document.getElementById('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
    })();

    /* ---------- Serveis que pugen ---------- */
    /* ---------- Idiomes: català, castellà i anglès ---------- */
    const i18n = {
      ca: {
        tag: 'Benestar conscient',
        title: 'Cuidem de tu en <strong>cada etapa</strong> de la vida',
        soon: 'Pròximament',
        lead: 'Un espai de <strong>benestar conscient</strong> on diferents professionals <strong>t’acompanyem</strong> amb una mirada <strong>integral, propera i personalitzada</strong>.',
        footer: 'NIU · BENESTAR CONSCIENT',
        doc: 'Niu · Benestar Conscient',
        serveis: [
          'Ginecologia', 'Fisioteràpia', 'Sòl pelvià', 'Fisioteràpia pediàtrica',
          'Psicologia', 'Nutrició', 'Comadrones', 'Quiromassatge', 'INDIBA',
          'Pilates', 'Ioga', 'Hatha ioga', 'Meditació', 'Preparació al part',
          'Recuperació postpart', 'Massatge perineal', 'Teràpia manual',
          'Reeducació postural', 'Pilates terapèutic', 'Acompanyament',
          'Embaràs', 'Maternitat', 'Cos · ment · ànima', 'Refugi', 'Força',
          'Empoderament', 'Escoltar(te)', 'Autocura', 'Contemplar(te)'
        ]
      },
      es: {
        tag: 'Bienestar consciente',
        title: 'Cuidamos de ti en <strong>cada etapa</strong> de la vida',
        soon: 'Próximamente',
        lead: 'Un espacio de <strong>bienestar consciente</strong> donde diferentes profesionales <strong>te acompañamos</strong> con una mirada <strong>integral, cercana y personalizada</strong>.',
        footer: 'NIU · BIENESTAR CONSCIENTE',
        doc: 'Niu · Bienestar Consciente',
        serveis: [
          'Ginecología', 'Fisioterapia', 'Suelo pélvico', 'Fisioterapia pediátrica',
          'Psicología', 'Nutrición', 'Matronas', 'Quiromasaje', 'INDIBA',
          'Pilates', 'Yoga', 'Hatha yoga', 'Meditación', 'Preparación al parto',
          'Recuperación posparto', 'Masaje perineal', 'Terapia manual',
          'Reeducación postural', 'Pilates terapéutico', 'Acompañamiento',
          'Embarazo', 'Maternidad', 'Cuerpo · mente · alma', 'Refugio', 'Fuerza',
          'Empoderamiento', 'Escuchar(te)', 'Autocuidado', 'Contemplar(te)'
        ]
      },
      en: {
        tag: 'Conscious wellbeing',
        title: 'Caring for you at <strong>every stage</strong> of life',
        soon: 'Coming soon',
        lead: 'A space for <strong>conscious wellbeing</strong> where a team of professionals <strong>supports you</strong> with a <strong>holistic, warm and personalised</strong> approach.',
        footer: 'NIU · CONSCIOUS WELLBEING',
        doc: 'Niu · Conscious Wellbeing',
        serveis: [
          'Gynaecology', 'Physiotherapy', 'Pelvic floor', 'Paediatric physiotherapy',
          'Psychology', 'Nutrition', 'Midwifery', 'Chiromassage', 'INDIBA',
          'Pilates', 'Yoga', 'Hatha yoga', 'Meditation', 'Birth preparation',
          'Postpartum recovery', 'Perineal massage', 'Manual therapy',
          'Postural re-education', 'Therapeutic Pilates', 'Support',
          'Pregnancy', 'Motherhood', 'Body · mind · soul', 'Refuge', 'Strength',
          'Empowerment', 'Listening', 'Self-care', 'Stillness'
        ]
      }
    };

    let serveis = i18n.ca.serveis;

    function setLang(lang, save) {
      const t = i18n[lang] || i18n.ca;
      document.documentElement.lang = lang;
      document.title = t.doc;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.innerHTML = t[el.dataset.i18n];
      });
      document.querySelectorAll('.lang button').forEach((b) => {
        b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
      });
      serveis = t.serveis;
      // les paraules que ja pugen es tradueixen al moment
      document.querySelectorAll('#float .word i').forEach((el) => {
        const i = el.dataset.i;
        if (i !== undefined) el.textContent = serveis[i];
      });
      if (save) { try { localStorage.setItem('niu-lang', lang); } catch (e) {} }
    }

    function initialLang() {
      const hash = location.hash.slice(1).toLowerCase();
      if (i18n[hash]) return hash;
      try {
        const saved = localStorage.getItem('niu-lang');
        if (i18n[saved]) return saved;
      } catch (e) {}
      const nav = (navigator.language || 'ca').slice(0, 2).toLowerCase();
      return i18n[nav] ? nav : 'ca';
    }

    document.querySelectorAll('.lang button').forEach((b) => {
      b.addEventListener('click', () => setLang(b.dataset.lang, true));
    });
    setLang(initialLang(), false);

    const layer = document.getElementById('float');
    let idx = Math.floor(Math.random() * serveis.length);

    function spawn(delay) {
      const el = document.createElement('span');
      const inner = document.createElement('i');
      el.className = 'word';
      const n = idx++ % serveis.length;
      inner.dataset.i = n;
      inner.textContent = serveis[n];
      el.appendChild(inner);

      const depth = Math.random();
      const size = (15 + depth * 28) * Math.min(1, innerWidth / 700 + 0.35);
      el.style.fontSize = size + 'px';
      const narrow = innerWidth < 700;
      el.style.setProperty('--o', ((narrow ? 0.14 : 0.2) + depth * (narrow ? 0.22 : 0.35)).toFixed(2));
      el.style.filter = depth < 0.35 ? 'blur(0.8px)' : 'none';
      el.style.animationDuration = (30 - depth * 12) + 's';
      if (delay) el.style.animationDelay = delay + 's';
      inner.style.animationDelay = (-Math.random() * 7) + 's';
      layer.appendChild(el);

      // en pantalles amples pugen sobretot pels laterals
      const vw = innerWidth, w = el.offsetWidth;
      let x;
      if (vw > 900) {
        const side = Math.random() < 0.5 ? 0 : 0.66;
        x = (side + 0.02 + Math.random() * 0.28) * vw - w / 2;
      } else {
        x = Math.random() * vw - w / 2;
      }
      el.dataset.cx = (x + w / 2) / vw;   // centre desitjat, per recol·locar-la si canvia la lletra
      place(el);
      el.addEventListener('animationend', (e) => { if (e.target === el) el.remove(); });
    }

    // manté cada paraula dins la pantalla (també quan acaba de carregar la lletra)
    function place(el) {
      const vw = innerWidth, w = el.offsetWidth;
      const x = el.dataset.cx * vw - w / 2;
      el.style.left = Math.max(28, Math.min(x, vw - w - 28)) + 'px';
    }
    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', () => {
        document.querySelectorAll('#float .word').forEach(place);
      });
    }

    function startWords() {
      if (reduce) return;
      const narrow = innerWidth < 700;
      for (let i = 0; i < (narrow ? 4 : 7); i++) spawn(-Math.random() * 18);
      setInterval(() => { if (!document.hidden) spawn(); }, narrow ? 3400 : 2000);
    }
    // espera la lletra manuscrita perquè les paraules es col·loquin amb la mida real
    if (document.fonts && document.fonts.load) {
      Promise.race([
        document.fonts.load('20px "Nothing You Could Do"'),
        new Promise((r) => setTimeout(r, 1500))
      ]).then(startWords, startWords);
    } else {
      startWords();
    }
  </script>
