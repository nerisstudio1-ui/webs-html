<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIU SPAI · Próximamente</title>
  <meta name="description" content="NIU SPAI — Muy pronto. Estamos preparando algo especial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe7;
      --bg-2: #ebe3d6;
      --ink: #2b2622;
      --muted: #7a6f64;
      --accent: #a8876a;
      --line: rgba(43, 38, 34, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Anillos tipo "nido" de fondo */
    .rings {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 0;
    }
    .rings span {
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 50%;
      animation: breathe 9s ease-in-out infinite;
    }
    .rings span:nth-child(1) { width: 280px;  height: 280px;  animation-delay: 0s; }
    .rings span:nth-child(2) { width: 460px;  height: 460px;  animation-delay: .8s; }
    .rings span:nth-child(3) { width: 660px;  height: 660px;  animation-delay: 1.6s; }
    .rings span:nth-child(4) { width: 880px;  height: 880px;  animation-delay: 2.4s; }
    .rings span:nth-child(5) { width: 1120px; height: 1120px; animation-delay: 3.2s; }

    @keyframes breathe {
      0%, 100% { transform: scale(1);    opacity: .9; }
      50%      { transform: scale(1.04); opacity: .45; }
    }

    header, main, footer { position: relative; z-index: 1; }

    header {
      padding: 32px 16px 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      animation: fadeUp 1.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mark {
      width: 56px;
      height: 56px;
      margin-bottom: 28px;
      color: var(--accent);
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: .12em;
      line-height: 1;
      margin-right: -.12em; /* compensa el tracking para centrar */
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent);
      margin: 32px auto;
    }

    .soon {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.5rem, 4.5vw, 2.2rem);
      color: var(--accent);
      margin-bottom: 14px;
    }

    .lead {
      max-width: 420px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--muted);
    }

    footer {
      padding: 0 16px 32px;
      text-align: center;
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .rings span, main { animation: none; }
    }
  </style>
</head>
<body>
  <div class="rings" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <header>Web en construcción</header>

  <main>
    <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
      <circle cx="32" cy="32" r="30"/>
      <circle cx="32" cy="32" r="21"/>
      <circle cx="32" cy="32" r="12"/>
      <circle cx="32" cy="32" r="3" fill="currentColor" stroke="none"/>
    </svg>

    <h1>NIU SPAI</h1>

    <div class="divider"></div>

    <p class="soon">Próximamente</p>
    <p class="lead">Estamos preparando algo especial. Muy pronto podrás descubrirlo aquí.</p>
  </main>

  <footer>&copy; <span id="year">2026</span> NIU SPAI</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
