<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Niu · Benestar Conscient</title>
  <meta name="description" content="Niu, espai de benestar conscient. Cuidem de tu en cada etapa de la vida. Pròximament.">
  <meta name="theme-color" content="#3868B0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Pantalla única: foto (o escena de llum i fulles) a sang, vel blau, marca al centre */
    :root {
      --blue: #3868B0;
      --blue-deep: #1f3f73;
      --cream: #FAF5F0;
      --cream-soft: rgba(250, 245, 240, 0.78);
      --wall: #eee2d2;
      --serif: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
      --sans: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--blue);
      color: var(--cream);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Fons ---------- */
    .scene, .photo, .veil, .grain, #float {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .scene { z-index: 0; width: 100%; height: 100%; background: var(--wall); }

    /* Foto real: col·loca "fondo.jpg" al costat d'aquest fitxer i substituirà l'escena */
    .photo {
      z-index: 1;
      background-position: center;
      background-size: cover;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 2.4s ease, transform 12s ease-out;
    }
    .photo.loaded { opacity: 1; transform: scale(1); }

    .veil {
      z-index: 2;
      background:
        radial-gradient(ellipse 70% 60% at 50% 48%, rgba(31, 63, 115, 0) 0%, rgba(31, 63, 115, .35) 100%),
        var(--blue);
      mix-blend-mode: multiply;
      opacity: .88;
    }
    .grain { z-index: 3; opacity: .05; background-size: 180px 180px; }

    /* ---------- Serveis que pugen ---------- */
    #float { z-index: 4; overflow: hidden; }
    .word {
      position: absolute;
      bottom: -10vh;
      white-space: nowrap;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      color: var(--cream);
      opacity: 0;
      will-change: transform, opacity;
      animation: rise linear forwards;
    }
    .word i {
      display: inline-block;
      font-style: inherit;
      animation: sway 7s ease-in-out infinite alternate;
    }
    @keyframes rise {
      0%   { transform: translateY(0);      opacity: 0; }
      14%  { opacity: var(--o); }
      78%  { opacity: var(--o); }
      100% { transform: translateY(-125vh); opacity: 0; }
    }
    @keyframes sway {
      from { transform: translateX(-12px); }
      to   { transform: translateX(12px); }
    }

    /* ---------- Contingut ---------- */
    main {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 72px 16px 88px;
    }
    main::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: min(760px, 100%);
      height: min(760px, 110vw);
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(31, 63, 115, .55) 0%, rgba(31, 63, 115, .25) 45%, transparent 70%);
      z-index: -1;
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(220px, 56vw, 320px);
      max-width: 100%;
      aspect-ratio: 1;
    }
    .breath {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(250, 245, 240, .38);
      animation: breathe 8s ease-in-out infinite;
    }
    .breath.two { inset: 13%; border-color: rgba(250, 245, 240, .22); animation-delay: -.7s; }
    @keyframes breathe {
      0%, 100% { transform: scale(.86); opacity: .5; }
      50%      { transform: scale(1);   opacity: 1; }
    }

    .logo {
      position: relative;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(4.4rem, 17vw, 7rem);
      letter-spacing: .16em;
      margin-right: -.16em;
      line-height: 1;
      padding-bottom: .08em;
      text-shadow: 0 2px 30px rgba(20, 40, 80, .35);
      animation: appear 2.4s ease both;
    }

    .tag {
      font-size: 11px;
      letter-spacing: .42em;
      margin-right: -.42em;
      text-transform: uppercase;
      color: var(--cream-soft);
      animation: appear 2.4s .5s ease both;
    }

    .line {
      width: 1px;
      height: 44px;
      margin: 26px auto;
      background: linear-gradient(var(--cream), transparent);
      opacity: .6;
      animation: appear 2.4s .8s ease both;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(1.9rem, 6vw, 2.9rem);
      line-height: 1.15;
      max-width: 560px;
      text-wrap: balance;
      text-shadow: 0 2px 24px rgba(20, 40, 80, .4);
      animation: appear 2.4s 1s ease both;
    }
    h1 em { font-weight: 400; }

    .soon {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: .38em;
      margin-right: -.38em;
      text-transform: uppercase;
      animation: appear 2.4s 1.3s ease both;
    }
    .soon::before, .soon::after {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
      opacity: .5;
    }

    .lead {
      max-width: 410px;
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.75;
      color: var(--cream-soft);
      animation: appear 2.4s 1.6s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
      to   { opacity: 1; transform: none; filter: none; }
    }

    footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 5;
      padding: 0 16px calc(22px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--cream-soft);
    }

    @media (max-height: 640px) {
      .logo-wrap { width: 190px; }
      .line { height: 24px; margin: 14px auto; }
      footer { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .breath, .word i, .logo, .tag, .line, h1, .soon, .lead { animation: none; }
      .photo { transition: none; }
    }
  </style>
</head>
<body>
  <canvas class="scene" id="scene" aria-hidden="true"></canvas>
  <div class="photo" id="photo" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="grain" id="grain" aria-hidden="true"></div>
  <div id="float" aria-hidden="true"></div>

  <main>
    <div class="logo-wrap">
      <span class="breath"></span>
      <span class="breath two"></span>
      <div class="logo">niu</div>
    </div>

    <p class="tag">Benestar conscient</p>

    <div class="line" aria-hidden="true"></div>

    <h1>Cuidem de tu en <em>cada etapa</em> de la vida</h1>

    <p class="soon">Pròximament</p>

    <p class="lead">Un espai de benestar conscient on diferents professionals t’acompanyem amb una mirada integral, propera i personalitzada.</p>
  </main>

  <footer>&copy; <span id="year">2026</span> NIU · BENESTAR CONSCIENT</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ---------- Foto real (opcional) ---------- */
    (function () {
      const src = 'fondo.jpg';
      const img = new Image();
      img.onload = () => {
        const el = document.getElementById('photo');
        el.style.backgroundImage = 'url("' + src + '")';
        requestAnimationFrame(() => el.classList.add('loaded'));
      };
      img.src = src;
    })();

    /* ---------- Gra de pel·lícula ---------- */
    (function () {
      const c = document.createElement('canvas');
      c.width = c.height = 180;
      const g = c.getContext('2d');
      const d = g.createImageData(180, 180);
      for (let i = 0; i < d.data.length; i += 4) {
        const v = Math.random() * 255;
        d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
        d.data[i + 3] = 255;
      }
      g.putImageData(d, 0, 0);
      document.getElementById('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
    })();

    /* ---------- Escena: llum de finestra i ombres de fulles sobre la paret ---------- */
    (function () {
      const cv = document.getElementById('scene');
      const ctx = cv.getContext('2d');
      let W, H, layers = [];

      function rand(a, b) { return a + Math.random() * (b - a); }

      // Dibuixa unes branques amb fulles (ombra) en un canvas fora de pantalla
      function makeLayer(scale, blur, alpha, seed) {
        const off = document.createElement('canvas');
        off.width = W; off.height = H;
        const g = off.getContext('2d');
        g.filter = 'blur(' + blur + 'px)';
        g.fillStyle = 'rgba(40, 30, 20,' + alpha + ')';
        g.strokeStyle = 'rgba(40, 30, 20,' + alpha + ')';
        const branches = 5 + seed;
        for (let b = 0; b < branches; b++) {
          // les branques entren des de dalt i la cantonada superior dreta
          let x = W * rand(0.45, 1.1);
          let y = -20;
          let ang = rand(Math.PI * 0.55, Math.PI * 0.85);
          const len = Math.max(W, H) * rand(0.5, 0.9) * scale;
          const steps = 40;
          g.lineWidth = 2.2 * scale;
          g.beginPath();
          g.moveTo(x, y);
          const pts = [];
          for (let s = 0; s < steps; s++) {
            ang += rand(-0.08, 0.08);
            x += Math.cos(ang) * len / steps;
            y += Math.sin(ang) * len / steps;
            g.lineTo(x, y);
            pts.push([x, y, ang]);
          }
          g.stroke();
          // fulles d'olivera: allargades i estretes
          pts.forEach(([px, py, a], i) => {
            if (i % 2) return;
            for (const side of [-1, 1]) {
              const la = a + side * rand(0.5, 1.1);
              const L = rand(22, 42) * scale;
              g.save();
              g.translate(px, py);
              g.rotate(la);
              g.beginPath();
              g.ellipse(L / 2, 0, L / 2, L * 0.16, 0, 0, Math.PI * 2);
              g.fill();
              g.restore();
            }
          });
        }
        return off;
      }

      function build() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        W = Math.round(innerWidth * dpr * 0.6);
        H = Math.round(innerHeight * dpr * 0.6);
        cv.width = W; cv.height = H;
        layers = [
          { img: makeLayer(1.25, 14, 0.30, 2), amp: 0.010, speed: 0.00021, phase: 0 },
          { img: makeLayer(0.9, 6, 0.38, 1),   amp: 0.016, speed: 0.00033, phase: 1.7 }
        ];
      }

      function wall() {
        const gr = ctx.createLinearGradient(0, 0, W, H);
        gr.addColorStop(0, '#f6ede1');
        gr.addColorStop(1, '#d9c8b4');
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);
        // taca de sol que entra per la finestra
        const sun = ctx.createRadialGradient(W * 0.62, H * 0.38, 0, W * 0.62, H * 0.38, Math.max(W, H) * 0.6);
        sun.addColorStop(0, 'rgba(255, 250, 240, .95)');
        sun.addColorStop(0.5, 'rgba(255, 246, 230, .35)');
        sun.addColorStop(1, 'rgba(255, 246, 230, 0)');
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, W, H);
      }

      function draw(t) {
        wall();
        for (const L of layers) {
          const r = Math.sin(t * L.speed + L.phase) * L.amp;
          const dx = Math.sin(t * L.speed * 0.7 + L.phase) * W * 0.006;
          ctx.save();
          ctx.translate(W * 1.05, -H * 0.1);   // punt de gir fora de pantalla, on "és" l'arbre
          ctx.rotate(r);
          ctx.translate(-W * 1.05 + dx, H * 0.1);
          ctx.drawImage(L.img, 0, 0);
          ctx.restore();
        }
      }

      let last = 0;
      function loop(t) {
        if (t - last > 40) { draw(t); last = t; }   // ~25 fps, suficient per a un moviment lent
        requestAnimationFrame(loop);
      }

      build();
      if (reduce) draw(0); else requestAnimationFrame(loop);

      let rt;
      addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(() => { build(); draw(performance.now()); }, 200);
      });
    })();

    /* ---------- Serveis que pugen ---------- */
    const serveis = [
      'Ginecologia', 'Fisioteràpia', 'Sòl pelvià', 'Fisioteràpia pediàtrica',
      'Psicologia', 'Nutrició', 'Comadrones', 'Quiromassatge', 'INDIBA',
      'Pilates', 'Ioga', 'Hatha ioga', 'Meditació', 'Preparació al part',
      'Recuperació postpart', 'Massatge perineal', 'Teràpia manual',
      'Reeducació postural', 'Pilates terapèutic', 'Acompanyament',
      'Embaràs', 'Maternitat', 'Cos · ment · ànima', 'Escoltar', 'Cuidar'
    ];
    const layer = document.getElementById('float');
    let idx = Math.floor(Math.random() * serveis.length);

    function spawn(delay) {
      const el = document.createElement('span');
      const inner = document.createElement('i');
      el.className = 'word';
      inner.textContent = serveis[idx++ % serveis.length];
      el.appendChild(inner);

      const depth = Math.random();
      const size = (15 + depth * 28) * Math.min(1, innerWidth / 700 + 0.35);
      el.style.fontSize = size + 'px';
      const narrow = innerWidth < 700;
      el.style.setProperty('--o', ((narrow ? 0.18 : 0.3) + depth * (narrow ? 0.3 : 0.5)).toFixed(2));
      el.style.filter = depth < 0.35 ? 'blur(1.5px)' : 'none';
      el.style.animationDuration = (30 - depth * 12) + 's';
      if (delay) el.style.animationDelay = delay + 's';
      inner.style.animationDelay = (-Math.random() * 7) + 's';
      layer.appendChild(el);

      // en pantalles amples pugen sobretot pels laterals
      const vw = innerWidth, w = el.offsetWidth;
      let x;
      if (vw > 900 && Math.random() < 0.8) {
        const side = Math.random() < 0.5 ? 0 : 0.66;
        x = (side + 0.02 + Math.random() * 0.3) * vw - w / 2;
      } else {
        x = Math.random() * vw - w / 2;
      }
      el.style.left = Math.max(16, Math.min(x, vw - w - 16)) + 'px';
      el.addEventListener('animationend', (e) => { if (e.target === el) el.remove(); });
    }

    if (!reduce) {
      const narrow = innerWidth < 700;
      for (let i = 0; i < (narrow ? 4 : 7); i++) spawn(-Math.random() * 18);
      setInterval(() => { if (!document.hidden) spawn(); }, narrow ? 3400 : 2000);
    }
  </script>
</body>
</html>
