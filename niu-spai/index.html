<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niu · Benestar Conscient</title>
  <meta name="description" content="Niu, espai de benestar conscient. Cuidem de tu en cada etapa de la vida. Pròximament.">
  <meta name="theme-color" content="#FAF5F0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #3868B0;
      --cream: #FAF5F0;
      --blue-soft: rgba(56, 104, 176, 0.10);
      --ink-muted: rgba(56, 104, 176, 0.72);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--cream);
      color: var(--blue);
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* ---------- Taques orgàniques de fons ---------- */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }
    .blob.b1 {
      width: 55vmax; height: 55vmax;
      top: -20vmax; left: -18vmax;
      background: radial-gradient(circle, rgba(56,104,176,.16), transparent 65%);
      animation: drift1 26s ease-in-out infinite alternate;
    }
    .blob.b2 {
      width: 50vmax; height: 50vmax;
      bottom: -22vmax; right: -16vmax;
      background: radial-gradient(circle, rgba(56,104,176,.13), transparent 65%);
      animation: drift2 32s ease-in-out infinite alternate;
    }
    .blob.b3 {
      width: 30vmax; height: 30vmax;
      top: 55%; left: 8%;
      background: radial-gradient(circle, rgba(222,190,160,.28), transparent 65%);
      animation: drift1 38s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
    @keyframes drift2 { to { transform: translate(-7vmax, -5vmax) scale(1.1); } }

    /* ---------- Serveis que pugen ---------- */
    #float {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .word {
      position: absolute;
      bottom: -10vh;
      white-space: nowrap;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      color: var(--blue);
      opacity: 0;
      will-change: transform, opacity;
      animation-name: rise;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }
    .word i {
      display: inline-block;
      font-style: inherit;
      animation: sway 7s ease-in-out infinite alternate;
    }
    @keyframes rise {
      0%   { transform: translateY(0);       opacity: 0; }
      12%  { opacity: var(--o); }
      80%  { opacity: var(--o); }
      100% { transform: translateY(-125vh);  opacity: 0; }
    }
    @keyframes sway {
      from { transform: translateX(-14px); }
      to   { transform: translateX(14px); }
    }

    /* ---------- Contingut central ---------- */
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
    }

    /* halo crema per llegir bé el text sobre les paraules */
    main::before {
      content: "";
      position: absolute;
      width: min(720px, 120vw);
      height: min(720px, 120vw);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(250,245,240,.97) 30%, rgba(250,245,240,.75) 50%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(230px, 58vw, 340px);
      aspect-ratio: 1;
      margin-bottom: 8px;
    }

    /* cercles que respiren (inspira 4s · expira 4s) */
    .breath {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(56,104,176,.28);
      animation: breathe 8s ease-in-out infinite;
    }
    .breath.two {
      inset: 12%;
      border-color: rgba(56,104,176,.18);
      background: var(--blue-soft);
      animation-delay: -.6s;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(.86); opacity: .55; }
      50%      { transform: scale(1);   opacity: 1; }
    }

    .logo {
      position: relative;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(4.6rem, 18vw, 7.4rem);
      letter-spacing: .16em;
      margin-right: -.16em;
      line-height: 1;
      padding-bottom: .08em;
      animation: appear 2.2s ease both;
    }

    .tag {
      font-size: 11px;
      letter-spacing: .42em;
      margin-right: -.42em;
      text-transform: uppercase;
      color: var(--ink-muted);
      animation: appear 2.2s .5s ease both;
    }

    .line {
      width: 1px;
      height: 44px;
      background: linear-gradient(var(--blue), transparent);
      margin: 26px auto;
      opacity: .5;
      animation: appear 2.2s .8s ease both;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: clamp(1.9rem, 6vw, 2.9rem);
      line-height: 1.15;
      max-width: 560px;
      animation: appear 2.2s 1s ease both;
    }
    h1 em { font-weight: 400; }

    .soon {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: .38em;
      margin-right: -.38em;
      text-transform: uppercase;
      animation: appear 2.2s 1.3s ease both;
    }
    .soon::before, .soon::after {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
      opacity: .45;
    }

    .lead {
      max-width: 400px;
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.75;
      color: var(--ink-muted);
      animation: appear 2.2s 1.6s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
      to   { opacity: 1; transform: none;             filter: none; }
    }

    footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 2;
      padding: 0 16px 22px;
      text-align: center;
      font-size: 11px;
      letter-spacing: .2em;
      color: var(--ink-muted);
    }

    @media (max-height: 640px) {
      .logo-wrap { width: 200px; }
      .line { height: 24px; margin: 14px auto; }
      footer { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .breath, .word i { animation: none; }
      .logo, .tag, .line, h1, .soon, .lead { animation: none; }
    }
  </style>
</head>
<body>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>

  <div id="float" aria-hidden="true"></div>

  <main>
    <div class="logo-wrap">
      <span class="breath"></span>
      <span class="breath two"></span>
      <div class="logo" aria-label="niu">niu</div>
    </div>

    <p class="tag">Benestar conscient</p>

    <div class="line" aria-hidden="true"></div>

    <h1>Cuidem de tu en <em>cada etapa</em> de la vida</h1>

    <p class="soon">Pròximament</p>

    <p class="lead">Un espai de benestar conscient on diferents professionals t’acompanyem amb una mirada integral, propera i personalitzada.</p>
  </main>

  <footer>&copy; <span id="year">2026</span> NIU · BENESTAR CONSCIENT</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const serveis = [
      'Ginecologia', 'Fisioteràpia', 'Sòl pelvià', 'Fisioteràpia pediàtrica',
      'Psicologia', 'Nutrició', 'Comadrones', 'Quiromassatge', 'INDIBA',
      'Pilates', 'Ioga', 'Hatha ioga', 'Meditació', 'Preparació al part',
      'Recuperació postpart', 'Massatge perineal', 'Teràpia manual',
      'Reeducació postural', 'Pilates terapèutic', 'Acompanyament',
      'Embaràs', 'Maternitat', 'Cos · ment · ànima', 'Escoltar', 'Cuidar'
    ];

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const layer = document.getElementById('float');
    let idx = Math.floor(Math.random() * serveis.length);

    function spawn() {
      const el = document.createElement('span');
      const inner = document.createElement('i');
      el.className = 'word';
      inner.textContent = serveis[idx++ % serveis.length];
      el.appendChild(inner);

      // profunditat: paraules llunyanes més petites, pàl·lides i desenfocades
      const depth = Math.random();
      const size = (15 + depth * 30) * Math.min(1, window.innerWidth / 700 + 0.35); // 15px – 45px
      const dur = 30 - depth * 12;                // les properes pugen més ràpid
      el.style.fontSize = size + 'px';
      el.style.setProperty('--o', (0.22 + depth * 0.5).toFixed(2));
      el.style.filter = depth < 0.35 ? 'blur(1.5px)' : 'none';
      el.style.animationDuration = dur + 's';
      inner.style.animationDelay = (-Math.random() * 7) + 's';

      layer.appendChild(el);

      // en pantalles amples, les paraules pugen sobretot pels laterals
      const vw = window.innerWidth;
      const w = el.offsetWidth;
      let x;
      if (vw > 900 && Math.random() < 0.8) {
        const side = Math.random() < 0.5 ? 0 : 0.66;
        x = (side + 0.02 + Math.random() * 0.3) * vw - w / 2;
      } else {
        x = Math.random() * vw - w / 2;
      }
      x = Math.max(16, Math.min(x, vw - w - 16));
      el.style.left = x + 'px';
      el.addEventListener('animationend', (e) => {
        if (e.target === el) el.remove();
      });
    }

    if (!reduce) {
      // omple la pantalla des del principi amb algunes paraules a mig camí
      for (let i = 0; i < 7; i++) {
        spawn();
        const w = layer.lastChild;
        w.style.animationDelay = (-Math.random() * 18) + 's';
      }
      setInterval(() => {
        if (!document.hidden) spawn();
      }, 1900);
    }
  </script>
</body>
</html>
