<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Niu · Cos i dona</title>
  <meta name="description" content="NIU · Cos i dona. Espai de benestar conscient per a la dona a Sencelles (Mallorca): ginecologia, llevadora, fisioteràpia, sòl pelvià, psicologia, nutrició, quiromassatge, Pilates, Barre i ioga.">
  <meta name="theme-color" content="#3868B0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <style>
    /* Pàgina llarga: capçalera fixa crema, seccions alternant blau Niu / crema / civada.
       Tot va dins #niu perquè el tema de WordPress no hi interfereixi. */
    :root {
      --blue: #3868B0;
      --blue-deep: #24477d;
      --blue-light: #ACC5E0;
      --cream: #FAF5F0;
      --oat: #E0DACB;
      --oat-soft: #EEE9DF;
      --ink: #26344f;
      --ink-soft: #5a6680;
      --sans: 'Jost', 'TT Norms', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      --hand: 'Nothing You Could Do', 'Segoe Print', 'Bradley Hand', cursive;
      --radius: 18px;
      --wrap: 1120px;
    }

    #niu, #niu * { margin: 0; padding: 0; box-sizing: border-box; }
    #niu h1, #niu h2, #niu h3, #niu p, #niu a, #niu li, #niu span, #niu strong, #niu em, #niu i,
    #niu button, #niu summary, #niu table, #niu th, #niu td, #niu nav, #niu header, #niu footer {
      color: inherit; font-family: inherit; font-style: normal; font-weight: inherit;
      text-transform: none; letter-spacing: inherit; line-height: inherit;
      text-shadow: none; box-shadow: none; background: none; border: 0;
    }
    #niu img { display: block; max-width: 100%; height: auto; border: 0; border-radius: 0; box-shadow: none; }
    #niu ul { list-style: none; }

    #niu {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 17px;
      line-height: 1.65;
      text-align: left;
      -webkit-font-smoothing: antialiased;
    }

    #niu .wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: 20px; }
    #niu section { padding-block: clamp(64px, 10vw, 112px); position: relative; }

    #niu .eyebrow {
      font-size: 12px; font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
      color: var(--blue);
    }
    #niu h2 {
      font-weight: 300; font-size: clamp(1.9rem, 4.2vw, 2.9rem); line-height: 1.2;
      letter-spacing: -.005em; text-wrap: balance; margin-top: 12px;
    }
    #niu h2 strong, #niu h1 strong { font-weight: 500; }
    #niu .intro { max-width: 60ch; margin-top: 18px; color: var(--ink-soft); }
    #niu .intro strong { font-weight: 500; color: var(--ink); }
    #niu .hand { font-family: var(--hand); font-weight: 400; letter-spacing: 0; }

    /* botons */
    #niu .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 26px; border-radius: 999px;
      font-size: 15px; font-weight: 500; letter-spacing: .04em; text-decoration: none;
      cursor: pointer; transition: transform .25s, background .25s, color .25s;
    }
    #niu .btn:hover { transform: translateY(-2px); }
    #niu .btn:focus-visible, #niu a:focus-visible, #niu button:focus-visible, #niu summary:focus-visible {
      outline: 2px solid currentColor; outline-offset: 3px;
    }
    #niu .btn-cream { background: var(--cream); color: var(--blue); }
    #niu .btn-blue { background: var(--blue); color: var(--cream); }
    #niu .btn-line { border: 1px solid currentColor; }

    /* ---------- Capçalera ---------- */
    #niu .top {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250, 245, 240, .92);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(56, 104, 176, .12);
      padding-top: env(safe-area-inset-top, 0px);
    }
    #niu .top .wrap { display: flex; align-items: center; gap: 24px; height: 68px; }
    #niu .top .brand { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--blue); line-height: 1; }
    #niu .top .brand img { width: 64px; }
    #niu .top .brand span { font-size: 8.5px; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; white-space: nowrap; }
    #niu .menu { display: flex; gap: 26px; margin-left: auto; }
    #niu .menu a { font-size: 14px; font-weight: 400; letter-spacing: .04em; text-decoration: none; color: var(--ink); }
    #niu .menu a:hover { color: var(--blue); }
    #niu .lang { display: flex; gap: 2px; }
    #niu .lang button {
      font-size: 11px; font-weight: 400; letter-spacing: .14em; color: var(--ink-soft);
      padding: 6px 9px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; line-height: 1;
    }
    #niu .lang button[aria-pressed="true"] { color: var(--blue); border-color: rgba(56, 104, 176, .4); }
    #niu .top .btn { padding: 10px 18px; font-size: 13px; }
    #niu .burger { display: none; margin-left: auto; padding: 8px; cursor: pointer; color: var(--blue); }
    #niu .burger svg { display: block; width: 26px; height: 26px; }

    @media (max-width: 960px) {
      #niu .menu, #niu .top .btn { display: none; }
      #niu .burger { display: block; margin-left: 0; }
      #niu .top .wrap { position: relative; justify-content: space-between; }
      #niu .top .lang { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #niu .top.open .menu {
        display: flex; flex-direction: column; gap: 4px;
        position: absolute; left: 0; right: 0; top: 100%;
        background: var(--cream); padding: 12px 20px 22px;
        border-bottom: 1px solid rgba(56, 104, 176, .15);
      }
      #niu .top.open .menu a { padding: 10px 0; font-size: 17px; }
    }

    /* ---------- Inici ---------- */
    #niu .hero { background: var(--cream); color: var(--blue); overflow: hidden; padding-block: clamp(56px, 9vw, 112px); border-bottom: 1px solid rgba(56, 104, 176, .12); }
    #niu .hero .wrap { position: relative; z-index: 2; max-width: 900px; text-align: center; }
    #niu .hero .hello { font-size: clamp(1.5rem, 3.4vw, 2.1rem); color: var(--blue); opacity: .75; }
    #niu .hero h1 { font-weight: 300; font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: 1.08; margin-top: 10px; text-wrap: balance; color: var(--blue); }
    #niu .hero .lead { margin: 24px auto 0; max-width: 52ch; font-size: 18px; color: var(--ink-soft); }
    #niu .hero .lead strong { font-weight: 500; color: var(--blue); }
    #niu .hero .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 34px; }
    #niu .dates { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 0; margin-top: 46px; }
    #niu .date { display: flex; align-items: center; gap: 14px; padding: 0 30px; text-align: left; }
    #niu .date + .date { border-left: 1px solid rgba(56, 104, 176, .3); }
    #niu .date .day { font-size: 3rem; font-weight: 300; line-height: 1; }
    #niu .date .txt { display: flex; flex-direction: column; line-height: 1.3; }
    #niu .date .month { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-soft); }
    #niu .date .what { font-weight: 500; font-size: 16px; }
    #niu .promo {
      display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin-top: 30px;
      padding: 10px 20px; border-radius: 999px; background: var(--blue-light); color: var(--blue-deep); font-size: 14.5px; line-height: 1.4;
    }
    #niu .promo strong { font-weight: 500; }

    #niu .float { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    #niu .word {
      position: absolute; bottom: -60px; white-space: nowrap;
      font-family: var(--hand); color: var(--blue); opacity: 0;
      animation: niuRise linear forwards; will-change: transform, opacity;
    }
    @keyframes niuRise {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: var(--o); } 80% { opacity: var(--o); }
      100% { transform: translateY(-110vh); opacity: 0; }
    }
    @media (max-width: 820px) { #niu .float { display: none; } }
    @media (max-width: 560px) {
      #niu .dates { flex-wrap: nowrap; }
      #niu .date { padding: 0 14px; gap: 10px; }
      #niu .date .day { font-size: 2.3rem; }
      #niu .date .what { font-size: 14px; }
      #niu .date .month { font-size: 10px; letter-spacing: .2em; }
    }

    /* ---------- Qui som ---------- */
    #niu .about .wrap { display: grid; grid-template-columns: .85fr 1.15fr; gap: clamp(32px, 6vw, 88px); align-items: center; }
    #niu .about .pic img { width: 100%; border-radius: 200px 200px 24px 24px; aspect-ratio: 760 / 975; object-fit: cover; }
    #niu .ideas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-top: 40px; }
    #niu .idea { border-top: 1px solid rgba(56, 104, 176, .3); padding-top: 16px; }
    #niu .idea .hand { color: var(--blue); font-size: 1.35rem; line-height: 1.3; }
    #niu .idea p { font-size: 15px; color: var(--ink-soft); margin-top: 6px; }
    @media (max-width: 860px) {
      #niu .about .wrap { grid-template-columns: 1fr; }
      #niu .about .pic { max-width: 380px; }
      #niu .ideas { grid-template-columns: 1fr; gap: 14px; }
    }

    /* ---------- Especialitats ---------- */
    #niu .serveis { background: var(--oat-soft); }
    #niu .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
    #niu .tabs button {
      font-size: 15px; font-weight: 400; padding: 11px 22px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(56, 104, 176, .35); color: var(--blue); line-height: 1.2;
    }
    #niu .tabs button[aria-selected="true"] { background: var(--blue); color: var(--cream); border-color: var(--blue); }
    #niu .group-intro { margin-top: 22px; color: var(--ink-soft); max-width: 62ch; }
    #niu .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; margin-top: 28px; align-items: start; }
    #niu .card {
      background: var(--cream); border-radius: var(--radius); padding: 26px 24px 22px;
      display: flex; flex-direction: column; gap: 10px; min-width: 0;
    }
    #niu .card h3 { font-size: 1.2rem; font-weight: 500; line-height: 1.3; color: var(--blue); }
    #niu .card p { font-size: 15px; color: var(--ink-soft); }
    #niu .card .hrs { font-size: 13px; line-height: 1.55; color: var(--ink); background: var(--oat-soft); border-radius: 12px; padding: 10px 12px; }
    #niu .card .hrs b { display: block; font-weight: 500; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }
    #niu .prices { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
    #niu .prices td { padding: 6px 0; border-bottom: 1px solid var(--oat); vertical-align: top; }
    #niu .prices td.d { color: var(--ink-soft); white-space: nowrap; padding: 6px 10px; text-align: right; }
    #niu .prices td.p { font-weight: 500; color: var(--blue); white-space: nowrap; text-align: right; }
    #niu .prices tr.extra td { font-size: 13px; color: var(--ink-soft); padding-top: 2px; }
    #niu .card .who { margin-top: auto; padding-top: 10px; font-size: 13px; letter-spacing: .06em; color: var(--ink); border-top: 1px solid var(--oat); }

    /* ---------- Equip ---------- */
    #niu .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 30px 22px; margin-top: 44px; }
    #niu .member { display: flex; flex-direction: column; min-width: 0; }
    #niu .member .ph { position: relative; border-radius: 160px 160px 18px 18px; overflow: hidden; background: var(--blue-light); aspect-ratio: 4 / 5; }
    #niu .member .ph img { width: 100%; height: 100%; object-fit: cover; }
    #niu .member .ph .soon {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      font-family: var(--hand); font-size: 1.4rem; color: var(--blue); padding: 20px;
    }
    #niu .member h3 { margin-top: 16px; font-size: 1.15rem; font-weight: 500; line-height: 1.3; }
    #niu .member .role { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); margin-top: 4px; }
    #niu .member .quote { margin: 10px 0 14px; font-size: 15px; color: var(--ink-soft); }
    #niu .member .when { margin-top: auto; font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--oat-soft); border-radius: 12px; padding: 10px 12px; }
    #niu .member .when b { display: block; font-weight: 500; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }

    @media (max-width: 600px) {
      #niu .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
      #niu .member h3 { font-size: 1rem; }
      #niu .member .role { font-size: 10px; letter-spacing: .14em; }
      #niu .member .quote { font-size: 13.5px; line-height: 1.5; }
      #niu .member .when { font-size: 12px; padding: 8px 10px; }
      #niu .member .ph .soon { font-size: 1.1rem; }
    }

    /* ---------- Horari ---------- */
    #niu .horari { background: var(--blue); color: var(--cream); }
    #niu .horari .eyebrow { color: var(--blue-light); }
    #niu .horari .intro { color: rgba(250, 245, 240, .82); }
    #niu .horari .intro strong { color: var(--cream); }
    #niu .tt { margin-top: 26px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
    #niu .tt table { width: 100%; min-width: 780px; border-collapse: separate; border-spacing: 6px; table-layout: fixed; }
    #niu .tt th { font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; text-align: left; padding: 0 4px 8px; border-bottom: 1px solid rgba(250, 245, 240, .3); }
    #niu .tt th.h, #niu .tt td.h { width: 84px; }
    #niu .tt td { vertical-align: top; padding: 0; }
    #niu .tt td.h { position: sticky; left: 0; z-index: 1; background: var(--blue); font-size: 13px; font-variant-numeric: tabular-nums; color: rgba(250, 245, 240, .85); padding: 9px 4px 0; }
    #niu .tt td.h small { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
    #niu .tt tr.sep td { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: rgba(250, 245, 240, .6); padding: 14px 4px 2px; }
    #niu .cl { border-radius: 10px; padding: 8px 10px; font-size: 13.5px; font-weight: 500; line-height: 1.3; height: 100%; }
    #niu .cl + .cl { margin-top: 6px; }
    #niu .cl small { display: block; font-size: 12px; font-weight: 400; opacity: .8; margin-top: 2px; }
    #niu .tt-hint { display: none; margin-top: 18px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: rgba(250, 245, 240, .7); }
    @media (max-width: 820px) {
      #niu .tt-hint { display: block; }
      #niu .tt { margin-inline: -20px; padding-inline: 14px; }
      #niu .tt table { min-width: 700px; }
      #niu .tt th.h, #niu .tt td.h { width: 58px; }
    }
    #niu .c1 { background: #FAF5F0; color: #3868B0; }
    #niu .c2 { background: #ACC5E0; color: #1f3d6e; }
    #niu .c3 { background: #E0DACB; color: #3a3426; }
    #niu .c4 { background: #D3E2CC; color: #2f4a33; }
    #niu .c5 { background: #F2D4CC; color: #6b3a2c; }
    #niu .c6 { background: #DCD3EE; color: #45336b; }
    #niu .c7 { background: #F5E4B5; color: #5e4810; }
    #niu .c8 { background: #C6E4DE; color: #1f4d47; }
    #niu .c9 { background: #F6D9BF; color: #6b4127; }
    #niu .c10 { background: #C9D6F2; color: #2a3f7a; }
    #niu .horari .sub { margin-top: 44px; font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 300; }
    #niu .horari .sub strong { font-weight: 500; }
    #niu .horari .sub-cons { margin-top: 64px; padding-top: 44px; border-top: 1px solid rgba(250, 245, 240, .25); }
    #niu .consult { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; padding: 20px 24px; border: 1px solid rgba(250, 245, 240, .3); border-radius: var(--radius); }
    #niu .consult strong { font-weight: 500; }

    /* ---------- Tallers + Així anem ---------- */
    #niu .duo { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 64px); }
    #niu .tallers { align-self: start; background: var(--blue-light); border-radius: 28px; padding: clamp(28px, 4vw, 44px); color: var(--blue-deep); }
    #niu .tallers .eyebrow { color: var(--blue-deep); }
    #niu .tallers .intro { color: var(--blue-deep); }
    #niu .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    #niu .chips li { font-size: 14px; padding: 7px 14px; border-radius: 999px; background: var(--cream); color: var(--blue-deep); }
    #niu .tallers .small { margin-top: 20px; font-size: 14px; }
    #niu .obra-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
    #niu .obra .pics { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 240px 240px; gap: 10px; }
    @media (max-width: 860px) { #niu .obra-grid { grid-template-columns: 1fr; } #niu .obra .pics { grid-template-rows: 200px 200px; } }
    #niu .obra .pics img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; }
    #niu .obra .pics img:first-child { grid-column: span 2; }
    #niu .steps { margin-top: 22px; display: grid; gap: 10px; }
    #niu .step { display: flex; align-items: center; gap: 12px; font-size: 15px; }
    #niu .step i { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 1.5px solid var(--blue); position: relative; }
    #niu .step.done i { background: var(--blue); }
    #niu .step.now i::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--blue); }
    #niu .step b { font-weight: 500; }
    #niu .step span.d { margin-left: auto; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
    @media (max-width: 860px) { #niu .duo { grid-template-columns: 1fr; } }

    /* ---------- Preguntes + normes ---------- */
    #niu .faqs { background: var(--oat-soft); }
    #niu .faq-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(28px, 5vw, 72px); }
    #niu details { border-bottom: 1px solid rgba(56, 104, 176, .2); }
    #niu details:first-child { border-top: 1px solid rgba(56, 104, 176, .2); }
    #niu summary {
      list-style: none; cursor: pointer; padding: 18px 40px 18px 0; position: relative;
      font-weight: 400; font-size: 17px; line-height: 1.4;
    }
    #niu summary::-webkit-details-marker { display: none; }
    #niu summary::after {
      content: "+"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      font-size: 24px; font-weight: 300; color: var(--blue); transition: transform .3s;
    }
    #niu details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
    #niu details p { padding: 0 40px 20px 0; color: var(--ink-soft); font-size: 15.5px; }
    #niu .rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 56px; }
    #niu .rule { background: var(--cream); border-radius: var(--radius); padding: 20px 20px 18px; }
    #niu .rule h3 { font-size: 15px; font-weight: 500; color: var(--blue); }
    #niu .rule p { font-size: 14.5px; color: var(--ink-soft); margin-top: 6px; }
    @media (max-width: 860px) { #niu .faq-grid { grid-template-columns: 1fr; } #niu .rules { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) { #niu .rules { grid-template-columns: 1fr; } }

    /* ---------- Contacte ---------- */
    #niu .contact { background: var(--blue); color: var(--cream); text-align: center; }
    #niu .contact .hand { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.2; }
    #niu .contact .intro { margin-inline: auto; color: rgba(250, 245, 240, .85); }
    #niu .contact .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 30px; }
    #niu .info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 56px; text-align: left; }
    #niu .info > div { border-top: 1px solid rgba(250, 245, 240, .3); padding-top: 14px; min-width: 0; overflow-wrap: anywhere; }
    #niu .info b { display: block; font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--blue-light); margin-bottom: 6px; }
    #niu .info a { text-decoration: none; border-bottom: 1px solid rgba(250, 245, 240, .4); }
    #niu .info p { font-size: 15.5px; }
    @media (max-width: 860px) { #niu .info { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        intro: 'If you can’t find the answer, write to us and we’ll get back to you as soon as we can.',
        items: [
          { q:'Do I need experience to start Pilates?', a:'No. Sessions adapt to each person’s level and needs, whether you are starting from scratch or already have experience.' },
          { q:'Can I take part if I’m pregnant?', a:'Yes, always with the right adaptations and under the instructor’s supervision. For Reformer Pilates we recommend our specific pregnancy group.' },
          { q:'How do I book my first session?', a:'For now, message us on WhatsApp. Very soon you’ll also be able to book through the app. At your first visit we’ll do an initial assessment to understand where you are and what you want.' },
          { q:'Do the professionals work together?', a:'Yes. It’s one of NIU’s values: our professionals share a view of your process so that your care is coherent, not a series of separate visits.' },
          { q:'Can I come to NIU just to look after myself?', a:'Absolutely. NIU is also a place to stay fit, prevent injuries and look after yourself regularly, whatever your age or stage of life.' },
          { q:'Which conditions or life stages do you focus on?', a:'Among others: pelvic floor (incontinence, diastasis), pregnancy and postpartum, menopause, back and neck pain, sports injury recovery and emotional wellbeing.' },
          { q:'Are sessions individual or in groups?', a:'Individual or in small groups.' },
          { q:'What should I bring to my first session?', a:'Comfortable clothes, non-slip socks, water and a towel.' },
          { q:'How can I pay?', a:'Cash, card or bank transfer. Movement classes work on a monthly plan.' },
          { q:'Is there parking nearby?', a:'Yes, there is a car park right next to the centre.' }
        ]
      },
      rules: [
        { t:'Cancellations', d:'Let us know at least 12 hours in advance. Later cancellations lose the session, unless there is a justified reason.' },
        { t:'Health', d:'Tell us about any medical condition, injury, pregnancy or treatment so we can adapt your care.' },
        { t:'Confidentiality', d:'All personal and health information is treated in the strictest confidence.' },
      ],
      contact: {
        hand: 'Start caring for yourself today',
        intro: 'Message us and we’ll help you find the right professional or class.',
        btn: 'Message us on WhatsApp',
        where: 'Find us', map: 'Get directions', talk: 'Get in touch', hours: 'Opening hours',
        hoursTxt: 'Monday to Friday<br>9am–2pm and 3–8pm', park: 'Parking', parkTxt: 'There is a car park right next to the centre.'
      },
      wa: 'Hi! I’d like some information about NIU.',
      words: ['Refuge','Strength','Empowerment','Listening','Self-care','Stillness','Pilates','Pelvic floor','Motherhood','Yoga','Calm','Body · mind · soul']
    }
  };

  /* ====== Pintar la pàgina ====== */
  const root = document.getElementById('niu');
  const $ = (s, el) => (el || root).querySelector(s);
  const $$ = (s, el) => Array.from((el || root).querySelectorAll(s));
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  let lang = 'ca', group = 0;

  function slots(t, days) {
    const by = {};
    days.forEach(([d, s]) => { (by[d] = by[d] || []).push(t.team[s]); });
    return Object.keys(by).map((d) => t.days[d] + ' · ' + by[d].join(', ')).join('<br>');
  }

  function renderServices(t) {
    t = t || T[lang];
    const g = t.serv.groups;
    $('.tabs').innerHTML = g.map((x, i) =>
      `<button type="button" role="tab" aria-selected="${i === group}" data-g="${i}">${esc(x.name)}</button>`).join('');
    $('.group-intro').textContent = g[group].intro;
    $('.cards').innerHTML = g[group].items.map((x) =>
      `<article class="card"><h3>${esc(x.n)}</h3><p>${esc(x.d)}</p>` +
      (x.prices ? `<table class="prices">${x.prices.map((r) =>
        `<tr${r[0].startsWith('+') ? ' class="extra"' : ''}><td>${esc(r[0])}</td><td class="d">${esc(r[1])}</td><td class="p">${esc(r[2])}</td></tr>`).join('')}</table>` : '') +
      (x.hours ? `<p class="hrs"><b>${esc(t.team.hours)}</b>${slots(t, CONSULTES.filter((c) => c[2] === 'indiba').map((c) => [c[0], c[1]]))}</p>` : '') +
      (x.who ? `<p class="who">${esc(x.who)}</p>` : '') + `</article>`).join('');
    $$('.tabs button').forEach((b) => b.addEventListener('click', () => { group = +b.dataset.g; renderServices(T[lang]); }));
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.doc;
    $$('[data-t]').forEach((el) => { el.innerHTML = get(t, el.dataset.t); });
    $$('[data-t-alt]').forEach((el) => { el.alt = get(t, el.dataset.tAlt); });
    $$('[data-t-aria]').forEach((el) => { el.setAttribute('aria-label', get(t, el.dataset.tAria)); });
    $$('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    const wa = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t.wa);
    $$('a.wa').forEach((a) => { a.href = wa; });

    $('.ideas').innerHTML = t.about.ideas.map((x) =>
      `<div class="idea"><p class="hand">${esc(x.t)}</p><p>${esc(x.d)}</p></div>`).join('');

    renderServices(t);

    $('.team-grid').innerHTML = TEAM.map((m) => {
      const p = t.team.people[m.id];
      const ph = m.photo
        ? `<img src="${m.photo}" alt="${esc(m.name)}" width="640" height="800">`
        : `<span class="soon">${esc(t.team.soon)}</span>`;
      const when = m.days
        ? `<p class="when"><b>${esc(t.team.consult)}</b>${slots(t, m.days)}</p>`
        : m.classes ? `<p class="when"><b>${esc(t.team.classes)}</b>${m.classes.map(([d, h]) => t.days[d] + ' · ' + h + ' h').join('<br>')}</p>` : '';
      return `<article class="member"><div class="ph">${ph}</div><h3>${esc(m.name)}</h3><p class="role">${esc(p.role)}</p><p class="quote">${esc(p.q)}</p>${when}</article>`;
    }).join('');

    /* horari de la sala, en files per hora */
    const starts = [...new Set(SESSIONS.map((x) => x[1]))].sort();
    const dur = (a, b) => (+b.slice(0, 2) * 60 + +b.slice(3)) - (+a.slice(0, 2) * 60 + +a.slice(3));
    let rows = '', pmDone = false;
    starts.forEach((h, n) => {
      if (n === 0) rows += `<tr class="sep"><td colspan="6">${esc(t.sched.morning)}</td></tr>`;
      if (!pmDone && h >= '14:00') { pmDone = true; rows += `<tr class="sep"><td colspan="6">${esc(t.sched.afternoon)}</td></tr>`; }
      rows += `<tr><td class="h">${h}</td>` + t.days.map((_, d) => {
        const x = SESSIONS.find((y) => y[0] === d && y[1] === h);
        if (!x) return '<td></td>';
        const extra = dur(x[1], x[2]) !== 60 ? `<small>${x[1]}–${x[2]}</small>` : '';
        return `<td><div class="cl ${CLASS_COLOR[x[3]]}">${esc(t.sched.names[x[3]])}${extra}</div></td>`;
      }).join('') + '</tr>';
    });
    $('.tt-mov').innerHTML = `<table><thead><tr><th class="h"></th>${t.days.map((d) => `<th>${esc(d)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;

    /* consultes: matí i tarda, una fila cadascun */
    const crow = (sl, label) => `<tr><td class="h">${esc(label)}<small>${esc(t.team[sl])}</small></td>` + t.days.map((_, d) =>
      '<td>' + CONSULTES.filter((c) => c[0] === d && c[1] === sl).map((c) =>
        `<div class="cl ${CONS_COLOR[c[2]]}">${esc(t.sched.cons[c[2]])}${c[3] ? `<small>${esc(c[3])}</small>` : ''}</div>`).join('') + '</td>').join('') + '</tr>';
    $('.tt-cons').innerHTML = `<table><thead><tr><th class="h"></th>${t.days.map((d) => `<th>${esc(d)}</th>`).join('')}</tr></thead><tbody>${crow('m', t.sched.morning)}${crow('t', t.sched.afternoon)}</tbody></table>`;

    $('.steps').innerHTML = t.obra.steps.map((x) =>
      `<p class="step ${x.s}"><i></i><b>${esc(x.t)}</b><span class="d">${esc(x.d)}</span></p>`).join('');
    $('.faq-list').innerHTML = t.faq.items.map((x) =>
      `<details><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join('');
    $('.rules').innerHTML = t.rules.map((x) =>
      `<div class="rule"><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p></div>`).join('');
  }

  function setLang(l, save) {
    lang = T[l] ? l : 'ca';
    render();
    if (save) { try { localStorage.setItem('niu-lang', lang); } catch (e) {} }
  }
  function initialLang() {
    const h = location.hash.slice(1).toLowerCase();
    if (T[h]) return h;
    try { const s = localStorage.getItem('niu-lang'); if (T[s]) return s; } catch (e) {}
    const n = (navigator.language || 'ca').slice(0, 2).toLowerCase();
    return T[n] ? n : 'ca';
  }
  $$('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang, true)));

  /* navegació dins el contenidor (funciona igual dins WordPress) */
  const top = $('.top'), burger = $('.burger');
  root.addEventListener('click', (e) => {
    const a = e.target.closest('[data-go]');
    if (!a) return;
    const target = document.getElementById(a.dataset.go);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    top.classList.remove('open'); burger.setAttribute('aria-expanded', 'false');
  });
  burger.addEventListener('click', () => {
    const open = top.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  $$('.year').forEach((el) => { el.textContent = new Date().getFullYear(); });
  setLang(initialLang(), false);

  /* paraules manuscrites que pugen al fons de l'inici */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layer = $('.float');
  let wi = 0;
  function spawn(delay) {
    const words = T[lang].words;
    const el = document.createElement('span');
    el.className = 'word';
    el.textContent = words[wi++ % words.length];
    const depth = Math.random();
    el.style.fontSize = (16 + depth * 22) * Math.min(1, innerWidth / 700 + 0.35) + 'px';
    el.style.setProperty('--o', (0.1 + depth * 0.18).toFixed(2));
    el.style.animationDuration = (26 - depth * 10) + 's';
    if (delay) el.style.animationDelay = delay + 's';
    layer.appendChild(el);
    const W = layer.clientWidth, w = el.offsetWidth;
    let x = Math.random() * W - w / 2;
    if (W > 820) x = (Math.random() < .5 ? Math.random() * .2 : .8 + Math.random() * .2) * W - w / 2;
    el.style.left = Math.max(12, Math.min(x, W - w - 12)) + 'px';
    el.addEventListener('animationend', () => el.remove());
  }
  if (!reduce) {
    for (let i = 0; i < 5; i++) spawn(-Math.random() * 16);
    setInterval(() => { if (!document.hidden) spawn(); }, 3000);
  }
})();
</script>
</body>
</html>
