<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Niu · Cos i dona</title>
  <meta name="description" content="NIU · Cos i dona. Espai de benestar per a la dona a Sencelles (Mallorca): ginecologia, llevadora, fisioteràpia, sòl pelvià, psicologia, nutrició, quiromassatge, INDIBA, Pilates, Barre i ioga">
  <meta name="theme-color" content="#3868B0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
  <style>
    /* Pàgina llarga: capçalera crema, inici civada, seccions alternant crema / civada / blau Niu.
       Tot va dins #niu perquè el tema de WordPress no hi interfereixi. */
    :root {
      --blue: #3868B0;
      --blue-deep: #24477d;
      --blue-light: #ACC5E0;
      --cream: #FAF5F0;
      --oat: #E0DACB;
      --oat-soft: #EEE9DF;
      --ink: #26344f;
      --ink-soft: #5a6680;
      --sans: 'Jost', 'TT Norms', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      --hand: 'Nothing You Could Do', 'Segoe Print', 'Bradley Hand', cursive;
      --radius: 18px;
      --wrap: 1120px;
    }

    #niu, #niu * { margin: 0; padding: 0; box-sizing: border-box; }
    #niu h1, #niu h2, #niu h3, #niu p, #niu a, #niu li, #niu span, #niu strong, #niu em, #niu i, #niu b, #niu small,
    #niu button, #niu summary, #niu table, #niu th, #niu td, #niu nav, #niu header, #niu footer {
      color: inherit; font-family: inherit; font-style: normal; font-weight: inherit;
      text-transform: none; letter-spacing: inherit; line-height: inherit;
      text-shadow: none; box-shadow: none; background: none; border: 0;
    }
    #niu img { display: block; max-width: 100%; height: auto; border: 0; border-radius: 0; box-shadow: none; }
    #niu ul { list-style: none; }

    #niu {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      font-size: 17px;
      line-height: 1.65;
      text-align: left;
      -webkit-font-smoothing: antialiased;
    }

    #niu .wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: 20px; }
    #niu section { padding-block: clamp(64px, 10vw, 112px); position: relative; }

    #niu .eyebrow { font-size: 12px; font-weight: 400; letter-spacing: .32em; text-transform: uppercase; color: var(--blue); }
    #niu h2 { font-weight: 300; font-size: clamp(1.9rem, 4.2vw, 2.9rem); line-height: 1.2; letter-spacing: -.005em; text-wrap: balance; margin-top: 12px; }
    #niu h2 strong, #niu h1 strong { font-weight: 500; }
    #niu .intro { max-width: 62ch; margin-top: 18px; color: var(--ink-soft); }
    #niu .intro strong { font-weight: 500; color: var(--ink); }
    #niu .hand { font-family: var(--hand); font-weight: 400; letter-spacing: 0; }

    /* botons */
    #niu .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 26px; border-radius: 999px;
      font-size: 15px; font-weight: 500; letter-spacing: .04em; text-decoration: none;
      cursor: pointer; transition: transform .25s, background .25s, color .25s;
    }
    #niu .btn:hover { transform: translateY(-2px); }
    #niu .btn:focus-visible, #niu a:focus-visible, #niu button:focus-visible, #niu summary:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    #niu .btn-cream { background: var(--cream); color: var(--blue); }
    #niu .btn-blue { background: var(--blue); color: var(--cream); }
    #niu .btn-line { border: 1px solid currentColor; }

    /* ---------- Capçalera ---------- */
    #niu .top {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250, 245, 240, .94);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(56, 104, 176, .12);
      padding-top: env(safe-area-inset-top, 0px);
    }
    #niu .top .wrap { display: flex; align-items: center; gap: 24px; height: 68px; }
    #niu .top .brand { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--blue); line-height: 1; }
    #niu .top .brand img { width: 64px; }
    #niu .top .brand span { font-size: 8.5px; letter-spacing: .32em; margin-right: -.32em; text-transform: uppercase; white-space: nowrap; }
    #niu .menu { display: flex; gap: 26px; margin-left: auto; }
    #niu .menu a { font-size: 14px; font-weight: 400; letter-spacing: .04em; text-decoration: none; color: var(--ink); }
    #niu .menu a:hover { color: var(--blue); }
    #niu .lang { display: flex; gap: 2px; }
    #niu .lang button { font-size: 11px; font-weight: 400; letter-spacing: .14em; color: var(--ink-soft); padding: 6px 9px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; line-height: 1; }
    #niu .lang button[aria-pressed="true"] { color: var(--blue); border-color: rgba(56, 104, 176, .4); }
    #niu .top .btn { padding: 10px 18px; font-size: 13px; }
    #niu .burger { display: none; margin-left: auto; padding: 8px; cursor: pointer; color: var(--blue); }
    #niu .burger svg { display: block; width: 26px; height: 26px; }
    @media (max-width: 960px) {
      #niu .menu, #niu .top .btn { display: none; }
      #niu .burger { display: block; margin-left: 0; }
      #niu .top .wrap { position: relative; justify-content: space-between; }
      #niu .top .lang { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #niu .top.open .menu {
        display: flex; flex-direction: column; gap: 4px;
        position: absolute; left: 0; right: 0; top: 100%;
        background: var(--cream); padding: 12px 20px 22px;
        border-bottom: 1px solid rgba(56, 104, 176, .15);
      }
      #niu .top.open .menu a { padding: 10px 0; font-size: 17px; }
    }

    /* ---------- Inici ---------- */
    #niu .hero { background: var(--oat-soft); color: var(--blue); overflow: hidden; padding-block: clamp(64px, 10vw, 128px); }
    #niu .hero .wrap { position: relative; z-index: 2; }
    #niu .hero .txt { max-width: 640px; }
    #niu .hero .hello { font-size: clamp(1.5rem, 3.4vw, 2.1rem); opacity: .8; }
    #niu .hero h1 { font-weight: 300; font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.08; margin-top: 10px; text-wrap: balance; }
    #niu .hero .lead { margin-top: 24px; max-width: 54ch; font-size: 18px; color: var(--ink-soft); }
    #niu .hero .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
    #niu .opening { display: flex; align-items: center; gap: 14px; margin-top: 44px; }
    #niu .opening .day { font-size: 3rem; font-weight: 300; line-height: 1; }
    #niu .opening .t { display: flex; flex-direction: column; line-height: 1.3; }
    #niu .opening .month { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-soft); }
    #niu .opening .what { font-weight: 500; font-size: 16px; }
    #niu .float { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    #niu .word { position: absolute; bottom: -60px; white-space: nowrap; font-family: var(--hand); color: var(--blue); opacity: 0; animation: niuRise linear forwards; will-change: transform, opacity; }
    @keyframes niuRise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: var(--o); } 80% { opacity: var(--o); } 100% { transform: translateY(-110vh); opacity: 0; } }
    @media (max-width: 820px) { #niu .float { display: none; } }

    /* ---------- Qui som: foto a tot el lateral ---------- */
    #niu .about { padding: 0; }
    #niu .about-grid { display: grid; grid-template-columns: 2fr 3fr; min-height: 600px; }
    #niu .about .pic { position: relative; min-height: 360px; }
    #niu .about .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #niu .about .body { padding: clamp(56px, 8vw, 104px) clamp(20px, 5vw, 80px); max-width: 760px; align-self: center; }
    #niu .ideas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; }
    #niu .idea { border-top: 1px solid rgba(56, 104, 176, .3); padding-top: 16px; }
    #niu .idea .hand { color: var(--blue); font-size: 1.3rem; line-height: 1.3; }
    #niu .idea p { font-size: 15px; color: var(--ink-soft); margin-top: 6px; }
    @media (max-width: 900px) {
      #niu .about-grid { grid-template-columns: 1fr; min-height: 0; }
      #niu .about .pic { min-height: 0; aspect-ratio: 4 / 3; }
      #niu .ideas { grid-template-columns: 1fr; gap: 14px; }
    }

    /* ---------- Especialitats ---------- */
    #niu .serveis { background: var(--oat-soft); }
    #niu .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
    #niu .tabs button { font-size: 15px; font-weight: 400; padding: 11px 22px; border-radius: 999px; cursor: pointer; border: 1px solid rgba(56, 104, 176, .35); color: var(--blue); line-height: 1.2; }
    #niu .tabs button[aria-selected="true"] { background: var(--blue); color: var(--cream); border-color: var(--blue); }
    #niu .group-intro { margin-top: 22px; color: var(--ink-soft); max-width: 62ch; }
    #niu .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 28px; align-items: stretch; }
    @media (max-width: 1000px) { #niu .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { #niu .cards { grid-template-columns: 1fr; } }
    #niu .card { background: var(--cream); border-radius: var(--radius); padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    #niu .card h3 { font-size: 1.2rem; font-weight: 500; line-height: 1.3; color: var(--blue); }
    #niu .card .d { font-size: 15px; color: var(--ink-soft); min-height: 7.4em; }
    #niu .card .end { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
    #niu .prices { width: 100%; border-collapse: collapse; font-size: 14.5px; }
    #niu .prices td { padding: 8px 0; border-bottom: 1px solid var(--oat); vertical-align: top; }
    #niu .prices td small { display: block; font-size: 12.5px; color: var(--ink-soft); line-height: 1.45; margin-top: 2px; }
    #niu .prices td.p { font-weight: 500; color: var(--blue); white-space: nowrap; text-align: right; padding-left: 14px; }
    #niu .card .note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
    #niu .hrs { font-size: 13.5px; line-height: 1.6; color: var(--ink); background: var(--oat-soft); border-radius: 12px; padding: 12px 14px; }
    #niu .hrs b { display: block; font-weight: 500; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }
    #niu .card .who { padding-top: 10px; font-size: 13px; letter-spacing: .06em; color: var(--ink); border-top: 1px solid var(--oat); }

    /* ---------- Equip ---------- */
    #niu .team-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 34px 22px; margin-top: 44px; }
    #niu .team-grid .member { flex: 0 1 250px; }
    #niu .member { display: flex; flex-direction: column; min-width: 0; }
    #niu .member .ph { border-radius: 160px 160px 18px 18px; overflow: hidden; background: var(--blue-light); aspect-ratio: 4 / 5; }
    #niu .member .ph img { width: 100%; height: 100%; object-fit: cover; }
    #niu .member h3 { margin-top: 16px; font-size: 1.15rem; font-weight: 500; line-height: 1.3; }
    #niu .member .role { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue); margin-top: 4px; }
    #niu .member .quote { margin-top: 10px; font-size: 15px; color: var(--ink-soft); }
    @media (max-width: 600px) {
      #niu .team-grid { gap: 28px 12px; }
      #niu .team-grid .member { flex: 0 1 calc(50% - 6px); }
      #niu .member h3 { font-size: 1rem; }
      #niu .member .role { font-size: 10px; letter-spacing: .14em; }
      #niu .member .quote { font-size: 13.5px; line-height: 1.5; }
    }

    /* ---------- Horari ---------- */
    #niu .horari { background: var(--blue); color: var(--cream); }
    #niu .horari .eyebrow { color: var(--blue-light); }
    #niu .horari .intro { color: rgba(250, 245, 240, .82); }
    #niu .horari .intro strong { color: var(--cream); }
    #niu .horari .sub { margin-top: 44px; font-size: clamp(1.3rem, 2.6vw, 1.7rem); font-weight: 300; }
    #niu .horari .sub strong { font-weight: 500; }
    #niu .horari .sub-cons { margin-top: 64px; padding-top: 44px; border-top: 1px solid rgba(250, 245, 240, .25); }
    #niu .tt { margin-top: 26px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
    #niu .tt table { width: 100%; min-width: 780px; border-collapse: separate; border-spacing: 6px; table-layout: fixed; }
    #niu .tt th { font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; text-align: left; padding: 0 4px 8px; border-bottom: 1px solid rgba(250, 245, 240, .3); }
    #niu .tt th.h, #niu .tt td.h { width: 92px; }
    #niu .tt td { vertical-align: top; padding: 0; }
    #niu .tt td.h { position: sticky; left: 0; z-index: 1; background: var(--blue); font-size: 13px; font-variant-numeric: tabular-nums; color: rgba(250, 245, 240, .85); padding: 9px 4px 0; }
    #niu .tt tr.sep td { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: rgba(250, 245, 240, .6); padding: 14px 4px 2px; }
    #niu .cl { border-radius: 10px; padding: 8px 10px; font-size: 13.5px; font-weight: 500; line-height: 1.3; }
    #niu .cl + .cl { margin-top: 6px; }
    #niu .cl small { display: block; font-size: 12px; font-weight: 400; opacity: .8; margin-top: 2px; }
    /* consultes: matí i tarda ben diferenciats */
    #niu .tt-cons tr.band td { padding: 0; }
    #niu .tt-cons .band-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 12px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }
    #niu .tt-cons .band-h svg { width: 18px; height: 18px; flex: none; }
    #niu .tt-cons .am .band-h { background: var(--cream); color: var(--blue); }
    #niu .tt-cons .pm .band-h { background: var(--blue-deep); color: var(--cream); }
    #niu .tt-cons td.cell { padding: 10px 8px; border-radius: 12px; }
    #niu .tt-cons tr.am-row td.cell { background: rgba(250, 245, 240, .14); }
    #niu .tt-cons tr.pm-row td.cell { background: rgba(20, 40, 80, .32); }
    #niu .tt-cons tr.gap td { height: 18px; }
    #niu .tt-hint { display: none; margin-top: 18px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: rgba(250, 245, 240, .7); }
    @media (max-width: 820px) {
      #niu .tt-hint { display: block; }
      #niu .tt { margin-inline: -20px; padding-inline: 14px; }
      #niu .tt table { min-width: 720px; }
      #niu .tt th.h, #niu .tt td.h { width: 58px; }
    }
    #niu .c1 { background: #FAF5F0; color: #3868B0; }
    #niu .c2 { background: #ACC5E0; color: #1f3d6e; }
    #niu .c3 { background: #E0DACB; color: #3a3426; }
    #niu .c4 { background: #D3E2CC; color: #2f4a33; }
    #niu .c5 { background: #F2D4CC; color: #6b3a2c; }
    #niu .c6 { background: #DCD3EE; color: #45336b; }
    #niu .c7 { background: #F5E4B5; color: #5e4810; }
    #niu .c8 { background: #C6E4DE; color: #1f4d47; }
    #niu .c9 { background: #F6D9BF; color: #6b4127; }
    #niu .c10 { background: #C9D6F2; color: #2a3f7a; }
    #niu .consult { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; padding: 20px 24px; border: 1px solid rgba(250, 245, 240, .3); border-radius: var(--radius); }
    #niu .consult strong { font-weight: 500; }

    /* ---------- L'espai ---------- */
    #niu .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 36px; }
    #niu .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    @media (max-width: 860px) { #niu .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* ---------- Preguntes ---------- */
    #niu .faqs { background: var(--oat-soft); }
    #niu .faq-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(28px, 5vw, 72px); }
    #niu details { border-bottom: 1px solid rgba(56, 104, 176, .2); }
    #niu details:first-child { border-top: 1px solid rgba(56, 104, 176, .2); }
    #niu summary { list-style: none; cursor: pointer; padding: 18px 40px 18px 0; position: relative; font-weight: 400; font-size: 17px; line-height: 1.4; }
    #niu summary::-webkit-details-marker { display: none; }
    #niu summary::after { content: "+"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 24px; font-weight: 300; color: var(--blue); transition: transform .3s; }
    #niu details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
    #niu details p { padding: 0 40px 20px 0; color: var(--ink-soft); font-size: 15.5px; }
    #niu .rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 56px; }
    #niu .rule { background: var(--cream); border-radius: var(--radius); padding: 20px 20px 18px; }
    #niu .rule h3 { font-size: 15px; font-weight: 500; color: var(--blue); }
    #niu .rule p { font-size: 14.5px; color: var(--ink-soft); margin-top: 6px; }
    @media (max-width: 860px) { #niu .faq-grid, #niu .rules { grid-template-columns: 1fr; } }

    /* ---------- Contacte ---------- */
    #niu .contact { background: var(--blue); color: var(--cream); text-align: center; }
    #niu .contact .hand { font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.2; }
    #niu .contact .intro { margin-inline: auto; color: rgba(250, 245, 240, .85); }
    #niu .contact .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 30px; }
    #niu .info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 56px; text-align: left; }
    #niu .info > div { border-top: 1px solid rgba(250, 245, 240, .3); padding-top: 14px; min-width: 0; overflow-wrap: anywhere; }
    #niu .info b { display: block; font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--blue-light); margin-bottom: 6px; }
    #niu .info a { text-decoration: none; border-bottom: 1px solid rgba(250, 245, 240, .4); }
    #niu .info p { font-size: 15.5px; }
    @media (max-width: 860px) { #niu .info { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px) { #niu .info { grid-template-columns: 1fr; } }

    #niu .foot { background: var(--blue-deep); color: rgba(250, 245, 240, .75); font-size: 13px; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); }
    #niu .foot .wrap { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; }
    #niu .foot img { width: 70px; }
    #niu .foot a { text-decoration: none; color: var(--cream); }

    @media (prefers-reduced-motion: reduce) {
      #niu { scroll-behavior: auto; }
      #niu .btn { transition: none; }
      #niu .float { display: none; }
    }
  </style>
</head>
<body>
<div id="niu">

  <header class="top" id="top">
    <div class="wrap">
      <a class="brand" href="#inici" data-go="inici"><img src="img/logo-blau.png" alt="niu" width="290" height="135"><span>Cos i dona</span></a>
      <nav class="menu" aria-label="Menú">
        <a href="#especialitats" data-go="especialitats" data-t="nav.serveis"></a>
        <a href="#equip" data-go="equip" data-t="nav.equip"></a>
        <a href="#horari" data-go="horari" data-t="nav.horari"></a>
        <a href="#preguntes" data-go="preguntes" data-t="nav.faq"></a>
        <a href="#contacte" data-go="contacte" data-t="nav.contacte"></a>
      </nav>
      <div class="lang" role="group" aria-label="Idioma · Language">
        <button type="button" data-lang="ca" lang="ca">CA</button>
        <button type="button" data-lang="es" lang="es">ES</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <a class="btn btn-blue book" href="#" target="_blank" rel="noopener" data-t="cta"></a>
      <button class="burger" type="button" aria-expanded="false" aria-controls="top" data-t-aria="nav.menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Inici -->
    <section class="hero" id="inici">
      <div class="float" aria-hidden="true"></div>
      <div class="wrap">
        <div class="txt">
          <p class="hello hand" data-t="hero.hello"></p>
          <h1 data-t="hero.title"></h1>

  /* ====== Pintar la pàgina ====== */
  const root = document.getElementById('niu');
  const $ = (s, el) => (el || root).querySelector(s);
  const $$ = (s, el) => Array.from((el || root).querySelectorAll(s));
  const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const toMin = (h) => +h.slice(0, 2) * 60 + +h.slice(3);
  const hm = (h) => h.replace(/^0/, '');
  let lang = 'ca', group = 0;

  /* agrupa [dia, text] per dia: "Dimarts · 9:00–14:00 i 15:00–20:00" */
  function dayLines(t, list) {
    const by = {};
    list.forEach(([d, txt]) => { (by[d] = by[d] || []).push(txt); });
    return Object.keys(by).sort().map((d) => `${esc(t.days[d])} · ${esc(by[d].join(t.and))}`).join('<br>');
  }
  function consHours(id) {
    return CONSULTES.filter((c) => c[2] === id).map((c) => [c[0], c[4] || SHIFT[c[1]]]);
  }
  function classHours(id) {
    return SESSIONS.filter((s) => s[3] === id).map((s) => [s[0], hm(s[1]) + (toMin(s[2]) - toMin(s[1]) !== 60 ? '–' + hm(s[2]) : '')]);
  }

  function renderServices() {
    const t = T[lang], S = t.serv, g = GROUPS[group];
    $('.tabs').innerHTML = GROUPS.map((x, i) =>
      `<button type="button" role="tab" aria-selected="${i === group}" data-g="${i}">${esc(S.groups[x.id][0])}</button>`).join('');
    $('.group-intro').textContent = S.groups[g.id][1];
    $('.cards').innerHTML = g.items.map((x) => {
      const [name, desc, note] = S.items[x.id];
      const rows = x.rows.map(([k, p]) => {
        const r = S.rows[x.id + '.' + k] || S.rows[k];
        return `<tr><td>${esc(r[0])}${r[1] ? `<small>${esc(r[1])}</small>` : ''}</td><td class="p">${esc(t.eur(p))}</td></tr>`;
      }).join('');
      const hours = x.cons ? [S.hours, consHours(x.cons)] : x.cls ? [S.classes, classHours(x.cls)] : null;
      return `<article class="card"><h3>${esc(name)}</h3><p class="d">${esc(desc)}</p>` +
        `<table class="prices">${rows}</table>` +
        (x.note && note ? `<p class="note">${esc(note)}</p>` : '') +
        `<div class="end">` +
        (hours && hours[1].length ? `<p class="hrs"><b>${esc(hours[0])}</b>${dayLines(t, hours[1])}</p>` : '') +
        (x.who ? `<p class="who">${esc(x.who)}</p>` : '') + `</div></article>`;
    }).join('');
    $$('.tabs button').forEach((b) => b.addEventListener('click', () => { group = +b.dataset.g; renderServices(); }));
  }

  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.doc;
    $$('[data-t]').forEach((el) => { el.innerHTML = get(t, el.dataset.t); });
    $$('[data-t-alt]').forEach((el) => { el.alt = get(t, el.dataset.tAlt); });
    $$('[data-t-aria]').forEach((el) => { el.setAttribute('aria-label', get(t, el.dataset.tAria)); });
    $$('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
    $$('a.book').forEach((a) => { a.href = BOOKING; });
    $$('a.wa').forEach((a) => { a.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t.wa); });

    $('.ideas').innerHTML = t.about.ideas.map(([a, b]) => `<div class="idea"><p class="hand">${esc(a)}</p><p>${esc(b)}</p></div>`).join('');
    renderServices();

    $('.team-grid').innerHTML = TEAM.map(([id, name, photo]) => {
      const [role, q] = t.team.people[id];
      return `<article class="member"><div class="ph"><img src="${photo}" alt="${esc(name)}" width="640" height="800"></div>` +
        `<h3>${esc(name)}</h3><p class="role">${esc(role)}</p><p class="quote">${esc(q)}</p></article>`;
    }).join('');

    /* horari de la sala, una fila per hora d'inici */
    const head = `<thead><tr><th class="h"></th>${t.days.map((d) => `<th>${esc(d)}</th>`).join('')}</tr></thead>`;
    const starts = [...new Set(SESSIONS.map((x) => x[1]))].sort();
    let rows = '', pm = false;
    starts.forEach((h, n) => {
      if (n === 0) rows += `<tr class="sep"><td colspan="6">${esc(t.sched.morning)}</td></tr>`;
      if (!pm && h >= '14:00') { pm = true; rows += `<tr class="sep"><td colspan="6">${esc(t.sched.afternoon)}</td></tr>`; }
      rows += `<tr><td class="h">${hm(h)}</td>` + t.days.map((_, d) => {
        const x = SESSIONS.find((y) => y[0] === d && y[1] === h);
        if (!x) return '<td></td>';
        const extra = toMin(x[2]) - toMin(x[1]) !== 60 ? `<small>${hm(x[1])}–${hm(x[2])}</small>` : '';
        return `<td><div class="cl ${CLASS_COLOR[x[3]]}">${esc(t.sched.names[x[3]])}${extra}</div></td>`;
      }).join('') + '</tr>';
    });
    $('.tt-mov').innerHTML = `<table>${head}<tbody>${rows}</tbody></table>`;

    /* consultes: matí i tarda en franges ben diferenciades */
    const band = (cls, icon, label, hours) => `<tr class="band ${cls}"><td colspan="6"><div class="band-h">${icon}${esc(label)} · ${hours}</div></td></tr>`;
    const crow = (sl) => `<tr class="${sl === 'm' ? 'am' : 'pm'}-row"><td class="h"></td>` + t.days.map((_, d) =>
      '<td class="cell">' + CONSULTES.filter((c) => c[0] === d && c[1] === sl).map((c) =>
        `<div class="cl ${CONS_COLOR[c[2]]}">${esc(t.sched.cons[c[2]])}${c[3] ? `<small>${esc(c[3])}</small>` : ''}${c[4] ? `<small>${c[4]}</small>` : ''}</div>`).join('') + '</td>').join('') + '</tr>';
    $('.tt-cons').innerHTML = `<table>${head}<tbody>` +
      band('am', SUN, t.sched.morning, SHIFT.m) + crow('m') + '<tr class="gap"><td colspan="6"></td></tr>' +
      band('pm', MOON, t.sched.afternoon, SHIFT.t) + crow('t') + '</tbody></table>';

    $('.faq-list').innerHTML = t.faq.items.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
    $('.rules').innerHTML = t.rules.map(([a, b]) => `<div class="rule"><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('');
  }

  function setLang(l, save) {
    lang = T[l] ? l : 'ca';
    render();
    if (save) { try { localStorage.setItem('niu-lang', lang); } catch (e) {} }
  }
  function initialLang() {
    const h = location.hash.slice(1).toLowerCase();
    if (T[h]) return h;
    try { const s = localStorage.getItem('niu-lang'); if (T[s]) return s; } catch (e) {}
    const n = (navigator.language || 'ca').slice(0, 2).toLowerCase();
    return T[n] ? n : 'ca';
  }
  $$('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang, true)));

  /* navegació dins el contenidor (funciona igual dins WordPress) */
  const top = $('.top'), burger = $('.burger');
  root.addEventListener('click', (e) => {
    const a = e.target.closest('[data-go]');
    if (!a) return;
    const target = document.getElementById(a.dataset.go);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    top.classList.remove('open'); burger.setAttribute('aria-expanded', 'false');
  });
  burger.addEventListener('click', () => {
    const open = top.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  $$('.year').forEach((el) => { el.textContent = new Date().getFullYear(); });
  setLang(initialLang(), false);

  /* paraules manuscrites que pugen a la dreta de l'inici */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layer = $('.float');
  let wi = 0;
  function spawn(delay) {
    const words = T[lang].words;
    const el = document.createElement('span');
    el.className = 'word';
    el.textContent = words[wi++ % words.length];
    const depth = Math.random();
    el.style.fontSize = (18 + depth * 22) + 'px';
    el.style.setProperty('--o', (0.12 + depth * 0.2).toFixed(2));
    el.style.animationDuration = (26 - depth * 10) + 's';
    if (delay) el.style.animationDelay = delay + 's';
    layer.appendChild(el);
    const W = layer.clientWidth, w = el.offsetWidth;
    const x = (0.62 + Math.random() * 0.34) * W - w / 2;
    el.style.left = Math.max(12, Math.min(x, W - w - 12)) + 'px';
    el.addEventListener('animationend', () => el.remove());
  }
  if (!reduce && innerWidth > 820) {
    for (let i = 0; i < 5; i++) spawn(-Math.random() * 16);
    setInterval(() => { if (!document.hidden) spawn(); }, 3000);
  }
})();
</script>
</body>
</html>
